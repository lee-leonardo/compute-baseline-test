[project]
name = "runtime-bench"
version = "0.1.0"
description = "Representative ML workloads for testing hardware differences across CPU and supported GPU runtimes"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.9.1", "numpy>=2.1,<3", "psutil>=6,<8"]

[project.optional-dependencies]
cpu = ["torch==2.9.1"]
cuda = ["torch==2.9.1", "nvidia-ml-py>=13,<14"]
mlx = ["mlx==0.32.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]

pipeline = ["scikit-learn==1.7.2", "transformers==4.57.3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.15"]

[project.scripts]
runtime-bench = "runtime_bench.cli:main"
runtime-bench-compare = "runtime_bench.compare:main"
runtime-bench-suite = "runtime_bench.experiments:main"
runtime-bench-export = "runtime_bench.reporting:main"
runtime-bench-fetch = "runtime_bench.model_specs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
conflicts = [[{extra = "cpu"}, {extra = "cuda"}]]

[tool.uv.sources]
torch = [
  {index = "torch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'"},
  {index = "torch-cuda", extra = "cuda", marker = "sys_platform != 'darwin'"},
]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = ["mlx: opt-in native Apple MLX GPU verification"]
