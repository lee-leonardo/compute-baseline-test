# Fetch minilm and prepare data/news-pairs.csv first (see docs/embedding.md).
# Choose a fresh checkpoint path before another training run.
version = 1
[defaults]
task = "embedding"
mode = "train"
model = "minilm"
data = "data/news-pairs.csv"
checkpoint = "results/embedding-model"
runtime = "torch"
device = "cpu"
precision = "fp32"
batch = 8
length = 64
steps = 50
warmup = 1
repeats = 3
limit = 2000
seed = 42
[[cases]]
name = "paired-embedding-training"
